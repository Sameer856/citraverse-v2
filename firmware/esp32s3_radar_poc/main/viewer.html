<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citraverse Radar</title>
<style>:root{color-scheme:dark;font:15px system-ui;background:#09121c;color:#e8f2fa}body{margin:0}header{padding:22px;border-bottom:1px solid #263443;display:flex;justify-content:space-between}h1{font-size:23px;margin:0}small{color:#91a6b8}main{padding:20px;max-width:1300px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.card{background:#122130;border:1px solid #263d50;border-radius:12px;padding:15px;flex:1;min-width:100px}.card b{display:block;font-size:25px;margin-top:5px}canvas{width:100%;height:65vh;min-height:300px;display:block;background:#0b1723;border:1px solid #263d50;border-radius:14px;touch-action:none}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0}button{background:#203c50;color:white;border:1px solid #45667c;border-radius:8px;padding:9px 18px;cursor:pointer}.legend{color:#a8bfd1;line-height:1.8}#state{color:#ffcb77}.motion{color:#ffbd69}.presence{color:#4bdbc4}</style>
<header><div><h1>Citraverse / Radar</h1><small>Live point cloud / ESP32-S3</small></div><span id="state">Connecting...</span></header><main><div class="stats"><div class="card">Viewer FPS<b id="fps">--</b></div><div class="card">Frame index<b id="frame">--</b></div><div class="card">Motion points<b id="motion">0</b></div><div class="card">Presence points<b id="presence">0</b></div><div class="card">Stream age<b id="age">--</b></div></div><canvas id="plot" aria-label="Interactive radar point cloud"></canvas><div class="controls"><button id="pause">Pause</button><button id="reset">Reset view</button><label>View radius <input id="range" type="range" min="1" max="25" value="8"> <span id="meters">8</span> m</label></div><div class="legend"><span class="motion">Orange: motion</span> / <span class="presence">Teal: presence</span> / Drag to rotate / Coordinates in metres / Radar at origin<br>Live preview keeps the newest frame; it is not a lossless recording. <span id="health"></span></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('plot'),ctx=canvas.getContext('2d');
let points=[],yaw=.35,pitch=.6,radius=8,paused=false,socket,inflight=false,lastMessage=0,lastNewFrame=0,lastIndex=null,received=0,rateTime=performance.now();
function parseFrame(buffer){
 const v=new DataView(buffer),n=v.byteLength;if(n<12||n>8192||v.getUint32(8,true)!==0||v.getUint32(4,true)*4!==n-12)throw Error('Bad frame header');
 const next=[];let motion=0,presence=0;
 for(let p=12;p<n;){if(n-p<4)throw Error('Short block');const type=v.getUint8(p),flag=v.getUint8(p+1),len=v.getUint16(p+2,true);p+=4;if(type!==4||flag>3||len%12||len>n-p)throw Error('Bad point block');if(!(flag&1))throw Error('Expected Cartesian points');
 for(let end=p+len;p<end;p+=12){next.push({x:v.getInt16(p,true)/100,y:v.getInt16(p+2,true)/100,z:v.getInt16(p+4,true)/100,velocity:v.getInt16(p+6,true)/100,snr:v.getInt16(p+8,true)/100,presence:!!(flag&2)});if(flag&2)presence++;else motion++;}}
 return{index:v.getUint32(0,true),points:next,motion,presence};
}
function connect(){socket=new WebSocket(`ws://${location.host}/ws`);socket.binaryType='arraybuffer';
 socket.onopen=()=>{lastMessage=performance.now();inflight=false;$('state').textContent='Connected / waiting for radar';};
 socket.onmessage=e=>{inflight=false;lastMessage=performance.now();if(typeof e.data==='string')return;try{const frame=parseFrame(e.data);if(frame.index!==lastIndex){lastIndex=frame.index;lastNewFrame=performance.now();received++;points=frame.points;$('frame').textContent=frame.index;$('motion').textContent=frame.motion;$('presence').textContent=frame.presence;draw();}}catch(err){$('state').textContent=err.message;}};
 socket.onclose=()=>{inflight=false;points=[];draw();$('state').textContent='Disconnected / reconnecting';setTimeout(connect,1500);};socket.onerror=()=>socket.close();}
setInterval(()=>{const now=performance.now();if(socket?.readyState===WebSocket.OPEN){if(now-lastMessage>5000&&inflight){socket.close();return;}if(!paused&&!inflight){inflight=true;socket.send('next');}const age=lastNewFrame?now-lastNewFrame:null;$('age').textContent=age===null?'--':`${(age/1000).toFixed(1)} s`;$('state').textContent=paused?'Paused':age===null?'Waiting for radar':age>2000?'Radar stream stale':'Live';if(!paused&&age>2000&&points.length){points=[];draw();}}
 if(now-rateTime>=1000){$('fps').textContent=(received*1000/(now-rateTime)).toFixed(1);received=0;rateTime=now;}},20);
function project(x,y,z){const a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return[canvas.width/2+a*canvas.width/(radius*2.8),canvas.height*.65-(z*Math.cos(pitch)+b*Math.sin(pitch))*canvas.width/(radius*2.8)];}
function line(a,b,color){ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(...project(...a));ctx.lineTo(...project(...b));ctx.stroke();}
function draw(){const dpr=devicePixelRatio||1,w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}ctx.clearRect(0,0,w,h);ctx.lineWidth=dpr;for(let i=-radius;i<=radius;i++){line([i,-radius,0],[i,radius,0],'#1e3343');line([-radius,i,0],[radius,i,0],'#1e3343');}line([0,0,0],[radius,0,0],'#ff9b81');line([0,0,0],[0,radius,0],'#73dbad');line([0,0,0],[0,0,radius],'#79aefe');ctx.font=`${13*dpr}px system-ui`;for(const [label,p] of [['X',[radius,0,0]],['Y',[0,radius,0]],['Z',[0,0,radius]]]){ctx.fillStyle='#c5d6e5';ctx.fillText(label,...project(...p));}for(const p of points){const [x,y]=project(p.x,p.y,p.z);ctx.fillStyle=p.presence?'#4bdbc4':'#ffbd69';ctx.beginPath();ctx.arc(x,y,3*dpr,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(...project(0,0,0),4*dpr,0,Math.PI*2);ctx.fill();}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
$('range').oninput=e=>{radius=+e.target.value;$('meters').textContent=radius;draw();};$('reset').onclick=()=>{yaw=.35;pitch=.6;draw();};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};window.onresize=draw;
setInterval(async()=>{try{const r=await fetch('/api/status');const s=await r.json();$('health').textContent=`Host frames ${s.frames} / preview copy drops ${s.viewer_copy_drops}`;}catch{}},3000);
draw();connect();
</script></html>
